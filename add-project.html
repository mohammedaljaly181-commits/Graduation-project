<main>
    <h2>تسجيل مشروع تخرج جديد</h2>

    <form onsubmit="alert('تم إرسال مقترح المشروع بنجاح'); return false;">

        <label>اسم المشروع:</label><br>
        <input type="text" placeholder="أدخل اسم المشروع" required>

        <br><br>

        <label>وصف المشروع:</label><br>
        <textarea rows="5" cols="40" required></textarea>

        <br><br>

        <label>أسماء أعضاء الفريق:</label><br>
        <input type="text" placeholder="أسماء الطلاب" required>

        <br><br>

        <label>المشرف الأكاديمي:</label><br>
        <select required>
            <option value="">اختر المشرف</option>
            <option>د. عز الدين</option>
            <option>د. سناء البشير</option>
            <option>د. الهادي</option>
        </select>

        <br><br>

        <label>التقنيات المستخدمة:</label><br>
        <input type="text" placeholder="HTML, CSS, JavaScript">

        <br><br>

        <label>ملف المشروع:</label><br>
        <input type="file" accept=".pdf">

        <br><br>

        <button type="submit">إرسال المشروع</button>

    </form>
</main>

<footer>
    <p>جميع حقوق التطوير محفوظة &copy; 2026</p>
</footer>
